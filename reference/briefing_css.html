<!--
  브리핑 리포트 CSS+JS 표준 스니펫 v1.0 (2026-05-18)
  briefing-report-generator 가 이 파일의 <style>~</style> 과 <script>~</script> 를
  그대로 복사하여 HTML 에 삽입한다. 수정은 이 파일에서만 한다.
-->

<!-- ===== 테마 토글 (상단 고정) ===== -->
<div
  style="
    position: sticky;
    top: 0;
    z-index: 99;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    justify-content: flex-end;
  "
>
  <button
    onclick="toggleTheme()"
    style="
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    "
  >
    <span id="theme-icon">☀️</span> <span id="theme-label">라이트 모드</span>
  </button>
</div>

<!-- ===== CSS ===== -->
<style>
  :root {
    --bg: #0f1419;
    --card: #1a212c;
    --text: #e8eaed;
    --sub: #9aa0a6;
    --border: #2d3742;
    --up: #3fb950;
    --down: #f85149;
    --neutral: #8b949e;
    --highlight: #58a6ff;
    --warning: #d29922;
    --debate: #8b5cf6;
    --contrarian: #d29922;
  }

  /* 라이트 모드 */
  [data-theme="light"] {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #24292f;
    --sub: #57606a;
    --border: #d0d7de;
    --up: #1a7f37;
    --down: #cf222e;
    --neutral: #57606a;
    --highlight: #0969da;
    --warning: #9a6700;
    --debate: #6639ba;
    --contrarian: #bc4c00;
  }
  [data-theme="light"] body {
    background: #f5f7fa;
  }
  [data-theme="light"] th {
    background: #eaeef2 !important;
    color: #1f2328 !important;
  }
  [data-theme="light"] td {
    background: #ffffff;
    color: #24292f;
    border-bottom-color: #d0d7de !important;
  }
  [data-theme="light"] tr:nth-child(even) td {
    background: #f6f8fa !important;
  }
  [data-theme="light"] tr:hover {
    background: #ddf4ff !important;
  }
  [data-theme="light"] .sec {
    background: #ffffff;
    border-color: #d0d7de;
  }
  [data-theme="light"] .debate-card {
    background: rgba(102, 57, 186, 0.08) !important;
  }
  [data-theme="light"] .contrarian-card {
    background: rgba(188, 76, 0, 0.08) !important;
  }
  [data-theme="light"] .warning-13f {
    background: #fff8c5 !important;
    color: #9a6700;
    border-color: #9a6700;
  }
  [data-theme="light"] .signal-bar {
    background: rgba(0, 0, 0, 0.08) !important;
  }
  [data-theme="light"] .scenario-tree .root {
    background: #f6f8fa;
    border-color: #d0d7de;
  }
  [data-theme="light"] .portfolio-card {
    background: #f6f8fa;
    border-color: #d0d7de;
  }
  [data-theme="light"] .footer {
    background: #f6f8fa;
    border-color: #d0d7de;
  }
  [data-theme="light"] .footer code {
    background: rgba(0, 0, 0, 0.06);
    color: #9a6700;
  }
  [data-theme="light"] .disclaimer {
    border-top-color: #d0d7de;
    color: #57606a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      sans-serif;
    padding: 16px;
    max-width: 960px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 1.7;
  }

  /* 헤더 */
  .header {
    text-align: center;
    padding: 24px 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 28px;
    margin-bottom: 6px;
  }
  .header .meta {
    color: var(--sub);
    font-size: 14px;
  }

  /* 색상 클래스 */
  .up {
    color: var(--up);
  }
  .down {
    color: var(--down);
  }
  .neutral {
    color: var(--neutral);
  }
  .highlight {
    color: var(--highlight);
  }
  .warning {
    color: var(--warning);
  }

  /* 셀 배경 */
  .bg-up {
    background: rgba(63, 185, 80, 0.1);
  }
  .bg-down {
    background: rgba(248, 81, 73, 0.1);
  }
  .bg-warning {
    background: rgba(210, 153, 34, 0.1);
  }
  .bg-highlight {
    background: rgba(88, 166, 255, 0.1);
  }

  /* 섹션 */
  .sec {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  .sec h2 {
    font-size: 20px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sec h3 {
    font-size: 16px;
    color: var(--highlight);
    margin: 16px 0 10px;
  }

  /* 표 */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 14px;
  }
  th {
    background: rgba(255, 255, 255, 0.04);
    padding: 10px 8px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid var(--border);
  }
  td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }
  tr:hover {
    background: rgba(255, 255, 255, 0.02);
  }

  /* debate-card (보라) */
  .debate-card {
    background: rgba(139, 92, 246, 0.06);
    border-left: 4px solid var(--debate);
    border-radius: 0 10px 10px 0;
    padding: 14px 18px;
    margin: 14px 0;
  }
  .debate-card .card-title {
    color: var(--debate);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .debate-card .bull {
    color: var(--up);
    margin-top: 6px;
  }
  .debate-card .bear {
    color: var(--down);
    margin-top: 6px;
  }
  .debate-card .verdict {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(139, 92, 246, 0.3);
  }

  /* contrarian-card (주황) */
  .contrarian-card {
    background: rgba(210, 153, 34, 0.06);
    border-left: 4px solid var(--contrarian);
    border-radius: 0 10px 10px 0;
    padding: 14px 18px;
    margin: 14px 0;
  }
  .contrarian-card .card-title {
    color: var(--contrarian);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .contrarian-card .assumption {
    color: var(--neutral);
    font-style: italic;
    margin-top: 6px;
  }
  .contrarian-card .signal {
    margin-top: 6px;
  }
  .contrarian-card .probability {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(210, 153, 34, 0.3);
  }

  /* 시그널 바 */
  .signal-bar {
    margin: 8px 0;
    height: 8px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 4px;
    overflow: hidden;
  }
  .signal-bar .fill {
    height: 100%;
    border-radius: 4px;
  }
  .signal-bar.up .fill {
    background: linear-gradient(90deg, var(--up), #2ea043);
  }
  .signal-bar.down .fill {
    background: linear-gradient(90deg, var(--down), #da3633);
  }
  .signal-bar.warning .fill {
    background: linear-gradient(90deg, var(--warning), #b08800);
  }
  .signal-bar.neutral .fill {
    background: linear-gradient(90deg, var(--neutral), #6e7681);
  }

  /* 히트맵 (6셀) */
  .heatmap {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin: 12px 0;
  }
  .heatmap .cell {
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    font-size: 13px;
  }
  .heatmap .green {
    background: rgba(63, 185, 80, 0.15);
    color: var(--up);
  }
  .heatmap .yellow {
    background: rgba(210, 153, 34, 0.15);
    color: var(--warning);
  }
  .heatmap .red {
    background: rgba(248, 81, 73, 0.15);
    color: var(--down);
  }

  /* 시나리오 트리 (G-8) */
  .scenario-tree {
    margin: 14px 0;
  }
  .scenario-tree .root {
    text-align: center;
    padding: 12px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .scenario-tree .branches {
    display: flex;
    gap: 14px;
  }
  .scenario-tree .branch {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
  }
  .scenario-tree .branch.a {
    background: rgba(63, 185, 80, 0.06);
    border: 1px solid var(--up);
  }
  .scenario-tree .branch.b {
    background: rgba(248, 81, 73, 0.06);
    border: 1px solid var(--down);
  }
  .scenario-tree .prob-bar {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    height: 6px;
    border-radius: 3px;
    margin-top: 8px;
  }
  .scenario-tree .prob-bar .fill {
    height: 6px;
    border-radius: 3px;
  }

  /* 연쇄 효과 플로우 (G-6) */
  .cascade {
    margin: 14px 0;
  }
  .cascade .step {
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 8px 0;
  }
  .cascade .first {
    background: rgba(255, 255, 255, 0.04);
    border-left: 3px solid var(--neutral);
  }
  .cascade .second {
    background: rgba(88, 166, 255, 0.08);
    border-left: 3px solid var(--highlight);
  }
  .cascade .third {
    background: rgba(210, 153, 34, 0.08);
    border-left: 3px solid var(--warning);
  }

  /* 4종 포트폴리오 그리드 */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 16px 0;
  }
  .portfolio-card {
    background: rgba(255, 255, 255, 0.03);
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .portfolio-card h4 {
    font-size: 15px;
    margin-bottom: 10px;
  }

  /* 태그 시스템 */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 4px;
  }
  .tag-red {
    background: rgba(248, 81, 73, 0.15);
    color: var(--down);
  }
  .tag-green {
    background: rgba(63, 185, 80, 0.15);
    color: var(--up);
  }
  .tag-yellow {
    background: rgba(210, 153, 34, 0.15);
    color: var(--warning);
  }
  .tag-blue {
    background: rgba(88, 166, 255, 0.15);
    color: var(--highlight);
  }
  .tag-purple {
    background: rgba(139, 92, 246, 0.15);
    color: var(--debate);
  }

  /* 이벤트 배지 */
  .event-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    margin: 2px;
  }
  .badge-critical {
    background: rgba(248, 81, 73, 0.2);
    color: var(--down);
    border: 1px solid var(--down);
  }
  .badge-high {
    background: rgba(210, 153, 34, 0.2);
    color: var(--warning);
    border: 1px solid var(--warning);
  }
  .badge-normal {
    background: rgba(88, 166, 255, 0.15);
    color: var(--highlight);
    border: 1px solid var(--highlight);
  }

  /* 이슈 카드 */
  .issue-card {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 10px 0;
    border-left: 3px solid var(--border);
  }
  .issue-card.critical {
    border-left-color: var(--down);
  }
  .issue-card.high {
    border-left-color: var(--warning);
  }
  .issue-card.normal {
    border-left-color: var(--highlight);
  }
  .issue-title {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 15px;
  }
  .issue-secondary {
    color: var(--sub);
    font-size: 13px;
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px dashed rgba(255, 255, 255, 0.06);
  }

  /* 시그널 아이템 (수평 정렬) */
  .signal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
    font-size: 14px;
  }
  .signal-label {
    width: 120px;
    flex-shrink: 0;
    color: var(--sub);
  }
  .signal-value {
    width: 120px;
    flex-shrink: 0;
    font-weight: 600;
  }
  .signal-bar-wrap {
    flex: 1;
  }

  /* 위험도 게이지 */
  .risk-gauge {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
  }
  .risk-dots {
    display: flex;
    gap: 4px;
  }
  .risk-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
  }
  .risk-dot.active-1,
  .risk-dot.active-2 {
    background: var(--up);
  }
  .risk-dot.active-3 {
    background: var(--warning);
  }
  .risk-dot.active-4,
  .risk-dot.active-5 {
    background: var(--down);
  }

  /* 프리마켓 배지 */
  .premarket-badge {
    display: inline-block;
    background: rgba(88, 166, 255, 0.12);
    border: 1px solid var(--highlight);
    color: var(--highlight);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
  }

  /* 13F 시차 경고 */
  .warning-13f {
    background: rgba(210, 153, 34, 0.1);
    border: 1px solid var(--warning);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 14px 0;
    color: var(--warning);
    font-size: 14px;
  }
  .warning-13f::before {
    content: "⚠️ ";
  }

  /* 푸터 */
  .footer {
    margin-top: 32px;
    padding: 20px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .footer h3 {
    color: var(--highlight);
    margin-bottom: 12px;
    font-size: 16px;
  }
  .footer table {
    font-size: 13px;
  }
  .footer code {
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--warning);
  }
  .cmd-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    font-size: 12px;
  }

  /* 주의사항 (F-7, G-9) */
  .disclaimer {
    margin-top: 24px;
    padding: 16px;
    border-top: 1px solid var(--border);
    color: var(--sub);
    font-size: 12px;
    line-height: 1.6;
  }
  .disclaimer h4 {
    color: var(--warning);
    margin-bottom: 8px;
    font-size: 13px;
  }

  /* 예측 시장 (Polymarket) */
  .prediction-bar {
    margin: 6px 0;
    height: 24px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .prediction-bar .fill {
    height: 100%;
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
  }
  .prediction-bar .fill.high {
    background: linear-gradient(90deg, var(--up), #2ea043);
  }
  .prediction-bar .fill.mid {
    background: linear-gradient(90deg, var(--warning), #b08800);
  }
  .prediction-bar .fill.low {
    background: linear-gradient(90deg, var(--down), #da3633);
  }
  .prediction-bar .pct {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    font-weight: 600;
  }
  .pm-change-up {
    color: var(--up);
    font-size: 12px;
  }
  .pm-change-down {
    color: var(--down);
    font-size: 12px;
  }
  .pm-source {
    color: var(--sub);
    font-size: 11px;
    font-style: italic;
    margin-top: 6px;
  }

  /* 모바일 */
  @media (max-width: 600px) {
    body {
      padding: 12px;
      font-size: 15px;
    }
    .header h1 {
      font-size: 22px;
    }
    .heatmap {
      grid-template-columns: repeat(3, 1fr);
    }
    .portfolio-grid {
      grid-template-columns: 1fr;
    }
    .scenario-tree .branches {
      flex-direction: column;
    }
    .signal-label {
      width: 80px;
    }
    .signal-value {
      width: 90px;
    }
    .cmd-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<!-- ===== JavaScript ===== -->
<script>
  function applyTheme(light) {
    if (light) {
      document.body.setAttribute("data-theme", "light");
      document.getElementById("theme-icon").textContent = "🌙";
      document.getElementById("theme-label").textContent = "다크 모드";
    } else {
      document.body.removeAttribute("data-theme");
      document.getElementById("theme-icon").textContent = "☀️";
      document.getElementById("theme-label").textContent = "라이트 모드";
    }
    localStorage.setItem("theme", light ? "light" : "dark");
  }
  function toggleTheme() {
    applyTheme(document.body.getAttribute("data-theme") !== "light");
  }
  (function () {
    applyTheme(localStorage.getItem("theme") === "light");
  })();
</script>
