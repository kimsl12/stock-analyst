<!--
  브리핑 리포트 CSS+JS 표준 스니펫 v2.0 (2026-06-11 — JW Research 통합 디자인 시스템)
  briefing-report-generator 가 이 파일의 <style>~</style> 과 <script>~</script> 를
  그대로 복사하여 HTML 에 삽입한다. 수정은 이 파일에서만 한다.
  토큰·타이포는 report_template.py 와 동일 (종목·브리핑 리포트 레이아웃 일관성).
-->

<!-- ===== 테마 토글 (상단 고정) ===== -->
<div
  style="
    position: sticky;
    top: 0;
    z-index: 99;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    justify-content: flex-end;
  "
>
  <button
    onclick="toggleTheme()"
    style="
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    "
  >
    <span id="theme-icon">☀️</span> <span id="theme-label">라이트 모드</span>
  </button>
</div>

<!-- ===== CSS ===== -->
<style>
  /* ===== JW Research 통합 디자인 시스템 v1 (2026-06-11) =====
     report_template.py 와 동일 토큰 — 종목·브리핑 리포트가 같은 팔레트·타이포 공유.
     변수명·클래스명은 generator 명세 호환을 위해 보존. */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  :root {
    --bg: #0a1118;
    --card: #121b26;
    --card2: #0e151e;
    --text: #e9edf3;
    --sub: #93a1b3;
    --border: #22303f;
    --up: #2fbf71;
    --down: #f4576a;
    --neutral: #8b97a5;
    --highlight: #5b9dff;
    --warning: #e5a43b;
    --debate: #9d7bff;
    --contrarian: #f08c4a;
  }

  /* 라이트 모드 — 토큰만 교체 (컴포넌트는 color-mix 가 자동 추종) */
  [data-theme="light"] {
    --bg: #f3f5f9;
    --card: #ffffff;
    --card2: #f7f9fc;
    --text: #19222e;
    --sub: #5c6878;
    --border: #d9e1ea;
    --up: #15803d;
    --down: #ce2f40;
    --neutral: #5c6878;
    --highlight: #1d6fe0;
    --warning: #a16207;
    --debate: #6644cc;
    --contrarian: #c2571f;
  }
  [data-theme="light"] .warning-13f {
    background: #fff8c5 !important;
    color: #a16207;
    border-color: #a16207;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family:
      "Pretendard Variable",
      Pretendard,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Apple SD Gothic Neo",
      "Noto Sans KR",
      sans-serif;
    padding: 20px 18px 28px;
    max-width: 920px;
    margin: 0 auto;
    font-size: 15.5px;
    line-height: 1.66;
    transition:
      background 0.3s,
      color 0.3s;
    -webkit-font-smoothing: antialiased;
  }

  /* 마스트헤드 — 리서치 노트 스타일 (좌측 정렬 + 액센트 룰) */
  .header {
    text-align: left;
    padding: 26px 0 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
    position: relative;
  }
  .header::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 64px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--highlight), transparent);
  }
  .header h1 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 6px;
  }
  .header .meta {
    color: var(--sub);
    font-size: 13.5px;
    letter-spacing: 0.01em;
  }

  /* 색상 클래스 */
  .up {
    color: var(--up);
  }
  .down {
    color: var(--down);
  }
  .neutral {
    color: var(--neutral);
  }
  .highlight {
    color: var(--highlight);
  }
  .warning {
    color: var(--warning);
  }

  /* 셀 배경 */
  .bg-up {
    background: color-mix(in srgb, var(--up) 10%, transparent);
  }
  .bg-down {
    background: color-mix(in srgb, var(--down) 10%, transparent);
  }
  .bg-warning {
    background: color-mix(in srgb, var(--warning) 10%, transparent);
  }
  .bg-highlight {
    background: color-mix(in srgb, var(--highlight) 10%, transparent);
  }

  /* 섹션 카드 */
  .sec {
    background: var(--card);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .sec h2 {
    font-size: 16.5px;
    font-weight: 750;
    letter-spacing: -0.01em;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .sec h2::before {
    content: "";
    width: 3.5px;
    height: 15px;
    border-radius: 2px;
    background: var(--highlight);
    flex: none;
  }
  .sec h3 {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--highlight);
    margin: 16px 0 8px;
  }

  /* 표 — 금융 데이터 표준 (소형 헤더 + tabular 숫자) */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  th {
    background: transparent;
    padding: 8px 10px;
    text-align: left;
    font-weight: 650;
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 0.05em;
    border-bottom: 1.5px solid var(--border);
  }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
  }
  tbody tr:nth-child(even) {
    background: color-mix(in srgb, var(--text) 2.5%, transparent);
  }
  tr:hover {
    background: color-mix(in srgb, var(--highlight) 7%, transparent);
  }

  /* debate-card (보라) — 핵심 논쟁 */
  .debate-card {
    background: color-mix(in srgb, var(--debate) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--debate) 22%, transparent);
    border-left: 4px solid var(--debate);
    border-radius: 0 10px 10px 0;
    padding: 15px 18px;
    margin: 14px 0;
  }
  .debate-card .card-title {
    color: var(--debate);
    font-weight: 750;
    margin-bottom: 8px;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .debate-card .bull {
    color: var(--up);
    margin-top: 6px;
  }
  .debate-card .bear {
    color: var(--down);
    margin-top: 6px;
  }
  .debate-card .verdict {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed color-mix(in srgb, var(--debate) 30%, transparent);
  }

  /* contrarian-card (주황) — 과소평가 포인트 */
  .contrarian-card {
    background: color-mix(in srgb, var(--contrarian) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--contrarian) 22%, transparent);
    border-left: 4px solid var(--contrarian);
    border-radius: 0 10px 10px 0;
    padding: 15px 18px;
    margin: 14px 0;
  }
  .contrarian-card .card-title {
    color: var(--contrarian);
    font-weight: 750;
    margin-bottom: 8px;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .contrarian-card .assumption {
    color: var(--neutral);
    font-style: italic;
    margin-top: 6px;
  }
  .contrarian-card .signal {
    margin-top: 6px;
  }
  .contrarian-card .probability {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed color-mix(in srgb, var(--contrarian) 30%, transparent);
  }

  /* 시그널 바 */
  .signal-bar {
    margin: 8px 0;
    height: 8px;
    background: color-mix(in srgb, var(--text) 7%, transparent);
    border-radius: 4px;
    overflow: hidden;
  }
  .signal-bar .fill {
    height: 100%;
    border-radius: 4px;
  }
  .signal-bar.up .fill {
    background: linear-gradient(90deg, var(--up), #2ea043);
  }
  .signal-bar.down .fill {
    background: linear-gradient(90deg, var(--down), #da3633);
  }
  .signal-bar.warning .fill {
    background: linear-gradient(90deg, var(--warning), #b08800);
  }
  .signal-bar.neutral .fill {
    background: linear-gradient(90deg, var(--neutral), #6e7681);
  }

  /* 히트맵 (6셀) */
  .heatmap {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin: 12px 0;
  }
  .heatmap .cell {
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    font-size: 13px;
  }
  .heatmap .green {
    background: color-mix(in srgb, var(--up) 14%, transparent);
    color: var(--up);
  }
  .heatmap .yellow {
    background: color-mix(in srgb, var(--warning) 14%, transparent);
    color: var(--warning);
  }
  .heatmap .red {
    background: color-mix(in srgb, var(--down) 14%, transparent);
    color: var(--down);
  }

  /* 시나리오 트리 (G-8) */
  .scenario-tree {
    margin: 14px 0;
  }
  .scenario-tree .root {
    text-align: center;
    padding: 12px;
    background: color-mix(in srgb, var(--text) 5%, transparent);
    border-radius: 8px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .scenario-tree .branches {
    display: flex;
    gap: 14px;
  }
  .scenario-tree .branch {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
  }
  .scenario-tree .branch.a {
    background: color-mix(in srgb, var(--up) 6%, transparent);
    border: 1px solid var(--up);
  }
  .scenario-tree .branch.b {
    background: color-mix(in srgb, var(--down) 6%, transparent);
    border: 1px solid var(--down);
  }
  .scenario-tree .prob-bar {
    width: 100%;
    background: color-mix(in srgb, var(--text) 5%, transparent);
    height: 6px;
    border-radius: 3px;
    margin-top: 8px;
  }
  .scenario-tree .prob-bar .fill {
    height: 6px;
    border-radius: 3px;
  }

  /* 연쇄 효과 플로우 (G-6) */
  .cascade {
    margin: 14px 0;
  }
  .cascade .step {
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 8px 0;
  }
  .cascade .first {
    background: color-mix(in srgb, var(--text) 5%, transparent);
    border-left: 3px solid var(--neutral);
  }
  .cascade .second {
    background: color-mix(in srgb, var(--highlight) 8%, transparent);
    border-left: 3px solid var(--highlight);
  }
  .cascade .third {
    background: color-mix(in srgb, var(--warning) 8%, transparent);
    border-left: 3px solid var(--warning);
  }

  /* 4종 포트폴리오 그리드 */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 16px 0;
  }
  .portfolio-card {
    background: color-mix(in srgb, var(--text) 4%, transparent);
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .portfolio-card h4 {
    font-size: 15px;
    margin-bottom: 10px;
  }

  /* 태그 시스템 */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 4px;
  }
  .tag-red {
    background: color-mix(in srgb, var(--down) 14%, transparent);
    color: var(--down);
  }
  .tag-green {
    background: color-mix(in srgb, var(--up) 14%, transparent);
    color: var(--up);
  }
  .tag-yellow {
    background: color-mix(in srgb, var(--warning) 14%, transparent);
    color: var(--warning);
  }
  .tag-blue {
    background: color-mix(in srgb, var(--highlight) 14%, transparent);
    color: var(--highlight);
  }
  .tag-purple {
    background: color-mix(in srgb, var(--debate) 14%, transparent);
    color: var(--debate);
  }

  /* 이벤트 배지 */
  .event-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    margin: 2px;
  }
  .badge-critical {
    background: color-mix(in srgb, var(--down) 18%, transparent);
    color: var(--down);
    border: 1px solid var(--down);
  }
  .badge-high {
    background: color-mix(in srgb, var(--warning) 18%, transparent);
    color: var(--warning);
    border: 1px solid var(--warning);
  }
  .badge-normal {
    background: color-mix(in srgb, var(--highlight) 14%, transparent);
    color: var(--highlight);
    border: 1px solid var(--highlight);
  }

  /* 이슈 카드 */
  .issue-card {
    background: color-mix(in srgb, var(--text) 3%, transparent);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 10px 0;
    border-left: 3px solid var(--border);
  }
  .issue-card.critical {
    border-left-color: var(--down);
  }
  .issue-card.high {
    border-left-color: var(--warning);
  }
  .issue-card.normal {
    border-left-color: var(--highlight);
  }
  .issue-title {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 15px;
  }
  .issue-secondary {
    color: var(--sub);
    font-size: 13px;
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px dashed color-mix(in srgb, var(--text) 7%, transparent);
  }

  /* 시그널 아이템 (수평 정렬) */
  .signal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
    font-size: 14px;
  }
  .signal-label {
    width: 120px;
    flex-shrink: 0;
    color: var(--sub);
  }
  .signal-value {
    width: 120px;
    flex-shrink: 0;
    font-weight: 600;
  }
  .signal-bar-wrap {
    flex: 1;
  }

  /* 위험도 게이지 */
  .risk-gauge {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
  }
  .risk-dots {
    display: flex;
    gap: 4px;
  }
  .risk-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--text) 7%, transparent);
  }
  .risk-dot.active-1,
  .risk-dot.active-2 {
    background: var(--up);
  }
  .risk-dot.active-3 {
    background: var(--warning);
  }
  .risk-dot.active-4,
  .risk-dot.active-5 {
    background: var(--down);
  }

  /* 프리마켓 배지 */
  .premarket-badge {
    display: inline-block;
    background: rgba(88, 166, 255, 0.12);
    border: 1px solid var(--highlight);
    color: var(--highlight);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
  }

  /* 13F 시차 경고 */
  .warning-13f {
    background: color-mix(in srgb, var(--warning) 10%, transparent);
    border: 1px solid var(--warning);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 14px 0;
    color: var(--warning);
    font-size: 14px;
  }
  .warning-13f::before {
    content: "⚠️ ";
  }

  /* 푸터 */
  .footer {
    margin-top: 32px;
    padding: 20px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .footer h3 {
    color: var(--highlight);
    margin-bottom: 12px;
    font-size: 16px;
  }
  .footer table {
    font-size: 13px;
  }
  .footer code {
    background: color-mix(in srgb, var(--text) 7%, transparent);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--warning);
  }
  .cmd-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    font-size: 12px;
  }

  /* 주의사항 (F-7, G-9) */
  .disclaimer {
    margin-top: 24px;
    padding: 16px;
    border-top: 1px solid var(--border);
    color: var(--sub);
    font-size: 12px;
    line-height: 1.6;
  }
  .disclaimer h4 {
    color: var(--warning);
    margin-bottom: 8px;
    font-size: 13px;
  }

  /* 예측 시장 (Polymarket) */
  .prediction-bar {
    margin: 6px 0;
    height: 24px;
    background: color-mix(in srgb, var(--text) 7%, transparent);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .prediction-bar .fill {
    height: 100%;
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
  }
  .prediction-bar .fill.high {
    background: linear-gradient(90deg, var(--up), #2ea043);
  }
  .prediction-bar .fill.mid {
    background: linear-gradient(90deg, var(--warning), #b08800);
  }
  .prediction-bar .fill.low {
    background: linear-gradient(90deg, var(--down), #da3633);
  }
  .prediction-bar .pct {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    font-weight: 600;
  }
  .pm-change-up {
    color: var(--up);
    font-size: 12px;
  }
  .pm-change-down {
    color: var(--down);
    font-size: 12px;
  }
  .pm-source {
    color: var(--sub);
    font-size: 11px;
    font-style: italic;
    margin-top: 6px;
  }

  /* 모바일 */
  @media (max-width: 600px) {
    body {
      padding: 12px;
      font-size: 15px;
    }
    .header h1 {
      font-size: 22px;
    }
    .heatmap {
      grid-template-columns: repeat(3, 1fr);
    }
    .portfolio-grid {
      grid-template-columns: 1fr;
    }
    .scenario-tree .branches {
      flex-direction: column;
    }
    .signal-label {
      width: 80px;
    }
    .signal-value {
      width: 90px;
    }
    .cmd-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
</style>

<!-- ===== JavaScript ===== -->
<script>
  function applyTheme(light) {
    if (light) {
      document.body.setAttribute("data-theme", "light");
      document.getElementById("theme-icon").textContent = "🌙";
      document.getElementById("theme-label").textContent = "다크 모드";
    } else {
      document.body.removeAttribute("data-theme");
      document.getElementById("theme-icon").textContent = "☀️";
      document.getElementById("theme-label").textContent = "라이트 모드";
    }
    localStorage.setItem("theme", light ? "light" : "dark");
  }
  function toggleTheme() {
    applyTheme(document.body.getAttribute("data-theme") !== "light");
  }
  (function () {
    applyTheme(localStorage.getItem("theme") === "light");
  })();
</script>
