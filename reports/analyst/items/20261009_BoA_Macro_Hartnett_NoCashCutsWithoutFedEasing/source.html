<h1>하트넷: 금리 인하 없이는 8조 달러 대기자금도 움직이지 않는다</h1>
<p>BoA 마이클 하트넷은 10월 9일(금) 노트에서 약 8조 달러 머니마켓펀드 자금이 연준의 지속적 완화 신호 전까지 위험자산으로 이동하지 않는다고 주장한 것으로 보도되었다(2차 보도, 익명 관계자 인용).</p>
