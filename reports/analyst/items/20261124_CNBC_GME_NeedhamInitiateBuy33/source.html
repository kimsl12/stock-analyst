<!doctype html><html lang="ko"><meta charset="utf-8"><body><h1>GME (게임스탑) — Needham, 매수로 신규 커버·목표가 $33</h1><ul><li>Needham이 GME를 매수 의견과 목표가 $33으로 신규 커버했다.</li><li>사업 전환이 효과를 내고 있다는 평가다.</li><li>목표가는 2028 회계연도 EV/EBITDA 10배를 기준으로 산정했다.</li><li>현재가 대비 상승여력은 기사에서 확인되지 않아 별도 점검이 필요하다.</li><li>밈 성격이 강한 종목이라 변동성 위험이 크다.</li></ul><p>출처: <a href="https://www.cnbc.com/2026/11/24/tuesday-wall-street-calls-like-nvidia-anthropic.html">CNBC (Tuesday&#x27;s biggest analyst calls)</a></p></body></html>
