<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>BNK투자증권 KB금융 (2026-09-29)</title></head><body>
<h1>BNK투자증권, KB금융 목표가 22만원 상향</h1>
<p>출처: <a href="https://www.newspim.com/news/view/20260929000165">뉴스핌 모닝 리포트</a> (본인 정리 요약, 2차기사 인용)</p>
<ul><li>BNK투자증권 김인 연구원: 투자의견 매수, 목표가 22만원 상향.</li>
<li>올해 지배주주순이익 전년 대비 14.8% 증가한 6조7000억원 전망.</li>
<li>3분기 비이자이익 41.7% 증가, 순이익 1조8565억원 전망.</li>
<li>총주주환원율 55% 웃돌 것으로 예상. ROE 12% 수준인데 PBR은 1.06배.</li>
<li>일평균 거래대금 23.6조원에서 52.9조원으로 확대되어 증권 수수료이익 증대.</li></ul></body></html>
