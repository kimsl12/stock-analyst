<!DOCTYPE html><html lang='ko'><head><meta charset='utf-8'><title>퀀티뉴엄 — BTIG 매수 등급으로 커버리지 개시, 목표가 60달러</title></head><body><h1>퀀티뉴엄 — BTIG 매수 등급으로 커버리지 개시, 목표가 60달러</h1><p>출처: 24/7 Wall St. 2026-11-12 일일 등급 변경 기사 (목요일 상향·하향 정리). 아래는 본인 정리 요지이며 원문 복사가 아니다.</p><p>BTIG가 퀀티뉴엄 커버리지를 매수로 개시했다. 목표가는 60달러이며 직전 목표가는 없다.</p><p>기사에는 개시 근거가 적시되지 않았다.</p><p>양자컴퓨팅 신규 상장 종목으로 장기 성장 기대와 실적 불확실성이 공존한다. 신규 상장 종목은 증권사 개시 의견이 수급 촉매가 되는 경향이 있다.</p><p><a href='https://247wallst.com/investing/2026/11/12/buy-sell-or-hold-thursdays-top-upgrades-and-downgrades-advanced-micro-devices-alibaba-group-cleveland-cliffs-conoco-phillips-diamondback-energy-general-mills-nvidia-toyota-wendys-and-m/'>원문 링크</a></p></body></html>
