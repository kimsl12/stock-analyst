<!doctype html><html lang="ko"><meta charset="utf-8"><body><h1>BA (보잉) — Mizuho, 아웃퍼폼으로 신규 커버·항공우주 최선호</h1><ul><li>Mizuho가 BA를 아웃퍼폼으로 신규 커버하며 항공우주 최선호 종목으로 지목했다.</li><li>수주잔고의 현금화가 핵심 논거다.</li><li>금리가 높아지면 보잉이 가장 먼저 수혜를 본다고 평가했다.</li><li>목표가는 기사에 공개되지 않았다.</li><li>Mizuho는 같은 날 방산·우주 다수 종목을 신규 커버해 섹터 전반 비교 시각을 제시했다.</li></ul><p>출처: <a href="https://www.cnbc.com/2026/11/24/tuesday-wall-street-calls-like-nvidia-anthropic.html">CNBC (Tuesday&#x27;s biggest analyst calls)</a></p></body></html>
